aid: unitq
name: unitQ
description: 'unitQ is an AI-powered customer feedback and product quality platform
  founded in 2018 and backed by Accel and Creandum. It unifies feedback from support
  tickets, app-store reviews, social channels, and surveys into a real-time quality
  signal (the unitQ Score) across products including monitorQ, supportQ, metricQ,
  socialQ, competeQ, interviewQ, and agentQ. unitQ publicly names a User Feedback
  Upload API for ingesting feedback data and a Data Enrichment API for attaching
  user attributes, platform details, and KPIs such as CSAT and NPS to feedback;
  the API reference lives in its login-gated help center.'
